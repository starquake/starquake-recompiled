name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The repository must never carry any part of the original game. This is
  # the one check that protects the project's whole footing, so it runs
  # first and on its own.
  no-game-data:
    name: no game or ROM data committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Nothing under assets/ but its README
        run: |
          stray=$(git ls-files assets | grep -v '^assets/README\.md$' || true)
          if [ -n "$stray" ]; then
            echo "::error::These must never be committed:"
            echo "$stray"
            exit 1
          fi

      - name: No game dumps anywhere in the tree
        run: |
          stray=$(git ls-files | grep -iE '\.(tap|tzx|z80|sna|rom|szx)$' || true)
          if [ -n "$stray" ]; then
            echo "::error::Game or ROM dumps must never be committed:"
            echo "$stray"
            exit 1
          fi

  build:
    name: build, test and lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # Keep in step with rust-toolchain.toml, which pins the same version
      # for local builds. Tracking `stable` here would mean a future Rust
      # release could fail CI on untouched code, because `clippy -D warnings`
      # gains lints with every release.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # What the window, sound and gamepad crates need to build on Linux.
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # The Z80 conformance corpus is the Fuse project's, under the GPL, so it
      # is fetched rather than committed — the same reason the game and the
      # ROM are not here. Pinned by hash, so a changed file is caught rather
      # than quietly changing what we test against.
      - name: Z80 test corpus
        run: |
          base='https://sourceforge.net/p/fuse-emulator/code/HEAD/tree/trunk/fuse/z80/tests'
          curl -fsSL --retry 3 -o assets/tests.in "$base/tests.in?format=raw"
          curl -fsSL --retry 3 -o assets/tests.expected "$base/tests.expected?format=raw"
          printf '%s  %s\n' \
            fec4e44dfa4fa889f976aa546a774d48c2a7366ab12312d449f79e85e68d77d7 assets/tests.in \
            207dc604db5d2a0a49ebd40e1bcb985a919e7a6e3dea1a52884ee05f9a1bf005 assets/tests.expected \
            | shasum -a 256 -c -

      - name: Test
        run: cargo test --workspace --locked

      # The conformance test passes when the corpus is absent, so prove it
      # actually ran rather than trusting that the step above worked.
      - name: Z80 conformance ran
        run: |
          cargo test -p zx-runtime --test fuse --locked -- --nocapture \
            | tee /tmp/fuse.log
          grep -q '1335/1335 cases match' /tmp/fuse.log

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The game library is meant to have no platform dependencies at all:
      # everything to do with windows, sound and input lives behind the
      # `frontend` feature. This is what keeps that true.
      - name: Library builds with no platform dependencies
        run: cargo build -p starquake --no-default-features --locked

      # The source leans on intra-doc links; this catches the broken ones.
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  # sq-verify is deliberately absent: it needs the player's own copy of the
  # game and the Spectrum ROM, which are never committed and should not be
  # uploaded to GitHub. (The Z80 conformance test does run here: its corpus
  # is nobody's copyrighted game, only a description of a processor.) Run it locally before opening a pull request:
  #
  #     cargo run --release -p sq-verify
  #
  # That matters most when a change was made to satisfy clippy: see
  # CONTRIBUTING.md for what to do when a lint argues with code that mirrors
  # the original.
