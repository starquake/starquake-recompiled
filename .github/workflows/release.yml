# Builds the playable program when a version tag is pushed, and attaches the
# binaries to a GitHub release.
#
# A binary is less useful here than it would be for most games: it still needs
# the player's own copy of Starquake to run, and refuses to start without one.
# It saves them installing Rust, and that is all it saves them. See assets/README.md.
#
# Linux and macOS only. CI does not build for Windows, so nothing here proves
# it works, and an unproven binary is worse than none.

name: Release

on:
  push:
    tags:
      - "v*"
  # So the build can be exercised without minting a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # What the window, sound and gamepad crates need to build on Linux.
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Build
        run: cargo build --release --locked --all-features -p starquake --target ${{ matrix.target }}

      # Named for the target, since three of these land in one release.
      - name: Package
        run: |
          dir=starquake-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/starquake "$dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE assets/README.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    name: attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          # The player still needs their own tape, and saying so at the point
          # of download saves somebody a confusing first run.
          body: |
            Built from `${{ github.ref_name }}`.

            **You need your own copy of Starquake to play.** The program contains no part of the original game and reads its graphics, maps, text and sound from the tape at startup. See `assets/README.md` in the archive for where to get one legitimately.

            Run it with: `./starquake path/to/starquake.tap`
          fail_on_unmatched_files: true
