[workspace]
resolver = "3"
members = [
    "crates/zx-core",
    "crates/zx-runtime",
    "crates/zx-recomp",
    "games/starquake",
    "tools/sq-verify",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
zx-core = { path = "crates/zx-core" }
zx-runtime = { path = "crates/zx-runtime" }
zx-recomp = { path = "crates/zx-recomp" }

# The reference interpreter runs the original for the differential checks;
# unoptimised it is far slower than the machine it models, so even dev builds
# get some optimisation.
[profile.dev]
opt-level = 1

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
