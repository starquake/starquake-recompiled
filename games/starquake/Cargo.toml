[package]
name = "starquake"
description = "A Rust reimplementation of Starquake (Bubble Bus, 1985). Requires your own copy of the original game."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["frontend"]
# The playable program (window, input, sound). The library alone has no
# platform dependencies.
frontend = ["dep:pixels", "dep:winit", "dep:cpal", "dep:gilrs", "dep:windows-sys"]

[dependencies]
# Only the snapshot loader and SHA-1; no emulation.
zx-core.workspace = true
pixels = { version = "0.17", optional = true }
winit = { version = "0.30", optional = true }
cpal = { version = "0.18", optional = true }
gilrs = { version = "0.11", optional = true }

# Only for putting a fatal startup error in a message box, since a Windows
# build has no console to print it to. Nothing else uses it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"], optional = true }

[[bin]]
name = "starquake"
required-features = ["frontend"]

[lints]
workspace = true
