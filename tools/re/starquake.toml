[game]
name = "Starquake"
tape = "starquake.tap"
tape_sha1 = "65450d6f33692c2c2868c0b497037f2cfd0ef3bd"
# Where the ROM's loader returns into the program (games/starquake/src/layout.rs).
entry_pc = 0x5E24
entry_sp = 0x5E20
rom = "48.rom"
rom_sha1 = "5ea7c2b824672e914525d1d5c419d71b84a426a2"

[analysis]
noreturn = [0x0008]
# Prints the 0xFF-terminated string that follows the CALL.
inline_strings = [0xd3c1]

[trace]
frames = 20000

# Menu: 1 = Kempston joystick, then 0 = start game.
[[trace.input]]
at = 250
keys = ["1"]

[[trace.input]]
at = 300
keys = ["0"]

[trace.random]
start = 400
every = 12
keys = ["joy_left", "joy_right", "joy_up", "joy_down", "joy_fire"]
seed = 7
